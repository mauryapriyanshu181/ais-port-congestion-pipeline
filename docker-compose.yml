name: ais-pipeline

x-spark: &spark
  image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
  user: root
  entrypoint: ["bash"]
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  environment:
    KAFKA_BOOTSTRAP: kafka:29092
    KAFKA_TOPIC: ais.raw
    LAKE_PATH: /data/lake
    CHECKPOINT_PATH: /data/checkpoints
    PORTS_FILE: /config/ports.json
    SPARK_DRIVER_MEMORY: 1g
    IVY_DIR: /opt/ivy
    CONGESTION_WINDOW: ${CONGESTION_WINDOW:-15 minutes}
    CONGESTION_WATERMARK: ${CONGESTION_WATERMARK:-5 minutes}
  volumes:
    - ./spark:/opt/jobs:ro
    - ./config:/config:ro
    - ./data:/data
    - ivy-cache:/opt/ivy
  restart: on-failure

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for containers (kafka:29092), PLAINTEXT_HOST for your laptop (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # 3 partitions keyed by MMSI, so each ship's reports stay in order; keep 1 day of raw data
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic ais.raw
        --partitions 3 --replication-factor 1
        --config retention.ms=86400000
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  producer:
    build: ./producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: ais.raw
      PRODUCER_MODE: ${PRODUCER_MODE:-mock}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      BOUNDING_BOXES: ${BOUNDING_BOXES:-}
      PORTS_FILE: /config/ports.json
    volumes:
      - ./config:/config:ro
    restart: on-failure:5

  # Kafka -> bronze (raw) and silver (clean, deduplicated) Delta tables
  spark-positions:
    <<: *spark
    ports:
      - "4040:4040"
    command: ["/opt/jobs/submit.sh", "/opt/jobs/stream_positions.py"]

  # silver -> gold port congestion; waits for the silver table so the two jobs
  # don't download the Spark packages into the shared cache at the same time
  spark-congestion:
    <<: *spark
    ports:
      - "4041:4040"
    command:
      - -c
      - >-
        until [ -f /data/lake/silver/ship_positions/_delta_log/00000000000000000000.json ]; do
        echo 'waiting for the silver table...'; sleep 10; done;
        exec bash /opt/jobs/submit.sh /opt/jobs/port_congestion.py

  # Streamlit dashboard reading the Delta tables directly
  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      LAKE_PATH: /data/lake
      PORTS_FILE: /config/ports.json
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
    restart: on-failure

volumes:
  ivy-cache:
